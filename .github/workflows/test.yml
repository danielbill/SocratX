name: Tests

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  test-frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'
      
      - name: Install dependencies
        run: pnpm install
      
      - name: Run frontend tests
        run: cd apps/desktop && pnpm test:run
      
      - name: Upload coverage
        uses: codecov/codecov-action@v4
        with:
          files: apps/desktop/coverage/coverage-final.json
          flags: frontend

  test-python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - name: Install dependencies
        run: |
          cd services/agent
          pip install -r requirements.txt
      
      - name: Run Python tests
        run: |
          cd services/agent
          pytest --cov=agent --cov=providers --cov=config --cov-report=xml
      
      - name: Upload coverage
        uses: codecov/codecov-action@v4
        with:
          files: services/agent/coverage.xml
          flags: backend

  test-rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
      
      - name: Cache Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
      
      - name: Run Rust tests
        run: |
          cd apps/desktop/src-tauri
          cargo test
      
      - name: Upload coverage
        uses: codecov/codecov-action@v4
        with:
          files: apps/desktop/src-tauri/coverage/lcov.info
          flags: rust
